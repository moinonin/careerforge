name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Ruff (report only — pre-existing violations tracked in TIGHTENING)
        run: .venv/bin/ruff check backend tests || true

      - name: MyPy (report only)
        run: .venv/bin/mypy backend || true

      - name: Pytest (hard gate)
        run: .venv/bin/pytest tests -q
