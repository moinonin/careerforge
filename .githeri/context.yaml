version: 1
framework: fastapi
entrypoint: backend/main.py
app_var: app
routers:
- file: backend/auth/router.py
  module: backend.auth.router
  vars:
  - router
  - users_router
- file: backend/api/routes/billing.py
  module: backend.api.routes.billing
  vars:
  - router
- file: backend/api/routes/generate.py
  module: backend.api.routes.generate
