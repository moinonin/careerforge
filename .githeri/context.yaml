  - router
- file: backend/api/routes/llm_config.py
  module: backend.api.routes.llm_config
  vars:
  - router
- file: backend/profiles/router.py
  module: backend.profiles.router
  vars:
  - router
mounted_routers:
- router: health.router
  prefix: ''
  tags:
  - health
  file: backend/main.py
- router: auth_router
  prefix: /api/v1/auth
  tags:
  - auth
  file: backend/main.py
- router: users_router
  prefix: /api/v1/users
  tags:
  - users
  file: backend/main.py
- router: profiles_router
  prefix: /api/v1/profiles
  tags:
  - profiles
  file: backend/main.py
- router: generate_router
  prefix: /api/v1/generate
  tags:
  - generation
  file: backend/main.py
- router: llm_config_router
  prefix: /api/v1/llm-config
  tags:
  - llm-config
  file: backend/main.py
- router: organizations_router
  prefix: ''
  tags:
  - organizations
  file: backend/main.py
- router: analyzer_router
  prefix: /api/v1/analyzer
  tags:
  - analyzer
  file: backend/main.py
- router: jev_analyzer_router
